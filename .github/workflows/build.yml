name: Build & Package Web Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-extension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        working-directory: ./younote-web
        run: npm ci

      - name: Install Extension Dependencies
        working-directory: ./younote-ex
        run: npm ci

      - name: Build Web Extension
        working-directory: ./younote-ex
        env:
          WXT_SUPABASE_URL: ${{ secrets.WXT_SUPABASE_URL }}
          WXT_SUPABASE_KEY: ${{ secrets.WXT_SUPABASE_KEY }}
          WXT_YT_KEY: ${{ secrets.WXT_YT_KEY }}
        run: npm run build

      - name: Create Zip Archive
        run: |
          cd younote-ex/.output/chrome-mv3
          zip -r ../../../younote-extension.zip .
          cd ../../..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Extension-Zip
          path: younote-extension.zip