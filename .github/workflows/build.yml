name: Build & Package Web Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-extension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: younote-ex/package-lock.json

      - name: Install dependencies
        working-directory: ./younote-ex
        run: npm ci

      - name: Build Web Extension
        working-directory: ./younote-ex
        env:
          WXT_SUPABASE_URL: ${{ secrets.WXT_SUPABASE_URL }}
          WXT_SUPABASE_KEY: ${{ secrets.WXT_SUPABASE_KEY }}
        run: npm run build

      - name: Create Zip Archive
        run: |
          cd younote-ex/.output/chrome-mv3
          zip -r ../../../younote-extension.zip .
          cd ../../..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Extension-Zip
          path: younote-extension.zip

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: younote-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}